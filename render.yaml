# Deployment template only: importing this Blueprint can create PAID resources.
# Review current Render pricing and approve the plans before applying.
# No resources have been provisioned by generating this file.
services:
  - type: web
    name: nghi-go-portfolio
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      # Render supplies RENDER_EXTERNAL_URL; PUBLIC_URL is optional unless
      # you attach a custom domain (then set it to that exact HTTPS origin).
      - key: DATABASE_URL
        fromDatabase:
          name: nghi-portfolio-db
          property: connectionString

databases:
  - name: nghi-portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: '17'
    region: singapore
    ipAllowList: []
