services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: portfolio
    volumes:
      - portfolio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  web:
    build: .
    environment:
      PORT: "8080"
      APP_ENV: development
      PUBLIC_URL: http://localhost:8080
      # URL-encode POSTGRES_PASSWORD if it contains URL-reserved characters.
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  portfolio-data:
